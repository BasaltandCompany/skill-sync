[package]
name = "skill-sync"
version = "0.1.0"
description = "skill-sync — org-wide agent skills, synced and optimized"
edition = "2021"

[lib]
name = "skill_sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
